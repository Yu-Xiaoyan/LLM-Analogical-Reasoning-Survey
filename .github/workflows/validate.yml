name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 06:00 UTC — link rot check.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Validate the paper database
        run: python scripts/validate.py

      - name: Rebuild generated files
        run: python scripts/build.py

      - name: Fail if generated files are stale
        run: |
          if ! git diff --quiet; then
            echo "::error::README.md / docs/ are out of date."
            echo "Run 'python scripts/build.py' and commit the result."
            git diff --stat
            exit 1
          fi

  links:
    # Advisory only — third-party sites rate-limit and go down.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py --check-links
