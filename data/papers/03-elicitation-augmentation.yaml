  in_survey: true
  tldr: >
    Analogical prompting — have the model self-generate relevant exemplars
    before solving, removing the need for hand-labelled demonstrations. The
    single most-cited method paper in this pillar; read alongside Qin et al.
    (2025), which questions whether the "relevance" is doing the work.

