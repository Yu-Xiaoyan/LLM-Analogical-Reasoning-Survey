- id: ushio2021distilling
  title: Distilling Relation Embeddings from Pretrained Language Models
  authors: Asahi Ushio, Jose Camacho-Collados and Steven Schockaert
  venue: EMNLP
  year: 2021
  subsection: relational-modeling
  tags: [must-read]
  links:
    paper: https://aclanthology.org/2021.emnlp-main.712/
    code: https://github.com/asahi417/relbert
  in_survey: false
  proposed_addition: true
  priority: P1
  gap_reason: >
    RelBERT is the central implementation of §5.2's "elevate relations to
    first-class units", and the survey cites only the same authors' analogy
    evaluation paper.
  tldr: >
    Fine-tunes a masked LM into a dedicated relation encoder; the embeddings
    generalise to relation types never seen in training, which is the strongest
    evidence that relational structure can be modelled explicitly.

