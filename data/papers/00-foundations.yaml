- id: gentner1983structure
  title: "Structure-Mapping: A Theoretical Framework for Analogy"
  authors: Dedre Gentner
  venue: Cognitive Science
  year: 1983
  subsection: theory
  tags: [must-read, cognitive-science]
  links:
    paper:
  in_survey: true
  tldr: >
    The foundational account: analogy aligns two domains by a one-to-one object
    mapping that preserves relations, and the systematicity principle says we
    prefer mappings that carry interconnected higher-order structure (causal
    chains) over isolated shared attributes.

