- id: falkenhainer1989structure
  title: "The Structure-Mapping Engine: Algorithm and Examples"
  authors: Brian Falkenhainer, Kenneth D. Forbus and Dedre Gentner
  venue: Artificial Intelligence
  year: 1989
  subsection: theory
  tags: [must-read, cognitive-science]
  links:
    paper: https://doi.org/10.1016/0004-3702(89)90077-5
  in_survey: false
  proposed_addition: true
  priority: P1
  gap_reason: >
    §2.1 writes structure-mapping as an algorithm-shaped constraint and cites
    only Gentner (1983); this is the algorithm that constraint came from.
  tldr: >
    Turns structure-mapping theory into a working matcher — the reference
    implementation every later computational account is measured against.

- id: gick1980analogical
  title: Analogical Problem Solving
  authors: Mary L. Gick and Keith J. Holyoak
  venue: Cognitive Psychology
  year: 1980
  subsection: theory
  tags: [must-read, cognitive-science]
  links:
    paper: https://doi.org/10.1016/0010-0285(80)90013-4
  in_survey: false
  proposed_addition: true
  priority: P1
  gap_reason: >
    The survey uses human performance as its benchmark throughout but cites no
    human transfer experiment; this is the canonical one.
  tldr: >
    The radiation/fortress studies — only 10% of people spontaneously transfer
    the analogous solution, rising to 75–92% once told the story is relevant.
    The human baseline for far analogy is far worse than usually assumed.

