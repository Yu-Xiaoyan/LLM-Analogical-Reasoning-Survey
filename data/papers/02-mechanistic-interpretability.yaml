# =========================================================================
# Proposed for the next revision — from the coverage audit (2026-08-21).
# This is the largest gap in the survey: §4 asks whether a mapped relation has
# an explicit, localisable representation, and the literature that answers that
# question causally is absent.
# =========================================================================

- id: todd2024function
  title: Function Vectors in Large Language Models
  authors: Eric Todd et al.
  venue: ICLR
  year: 2024
  subsection: relational-representation
  tags: [must-read]
  links:
    paper: https://arxiv.org/abs/2310.15213
  in_survey: false
  proposed_addition: true
  priority: P1
  gap_reason: >
    §4.1 asks whether the mapped relation admits an explicit, localisable
    representation. This answers yes, causally, and the survey does not cite it.
  tldr: >
    A small set of mid-layer attention heads encodes an input-output relation
    as a single transportable vector; inject it into an unrelated zero-shot
    context and the model performs the relation. Localisation plus causal
    intervention, which correlational probing cannot deliver.

- id: hendel2023incontext
  title: In-Context Learning Creates Task Vectors
  authors: Roee Hendel, Mor Geva and Amir Globerson
  venue: EMNLP Findings
  year: 2023
  subsection: relational-representation
  tags: [must-read]
  links:
    paper: https://arxiv.org/abs/2310.15916
  in_survey: false
  proposed_addition: true
  priority: P1
  gap_reason: >
    Independent, contemporaneous confirmation of the same mechanism; citing
    both is what makes the finding safe to build on.
  tldr: >
    Demonstrations compress into a single task vector that parameterises the
    model's behaviour — the same result as function vectors, reached from the
    in-context-learning side.

- id: olsson2022incontext
  title: In-context Learning and Induction Heads
  authors: Catherine Olsson et al.
  venue: Transformer Circuits Thread
  year: 2022
  subsection: process-decomposability
  tags: [must-read]
  links:
    paper: https://arxiv.org/abs/2209.11895
  in_survey: false
  proposed_addition: true
  priority: P1
  gap_reason: >
    The mechanism §4.4 needs, and the prerequisite for the 2026 finding that
    analogical behaviour is scaffolded on a copying circuit.
  tldr: >
    Identifies heads that complete patterns by copying from earlier context,
    and shows they appear exactly when in-context learning does — the concrete
    circuit behind pattern completion.

- id: anon2025whichheads
  date: 2025-02
  title: Which Attention Heads Matter for In-Context Learning?
  authors: Kayo Yin and Jacob Steinhardt
  venue: ICML
  year: 2025
  subsection: relational-representation
  links:
    paper: https://arxiv.org/abs/2502.14010
  in_survey: false
  proposed_addition: true
  priority: P2
  gap_reason: >
    Separates induction heads from function-vector heads and finds the former
    often mature into the latter — a developmental account that §4 can use.

