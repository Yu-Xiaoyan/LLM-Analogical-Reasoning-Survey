  tldr: >
    Not an analogy paper, but the methodological template this section borrows:
    relations can be localised to specific parameters and causally intervened
    on, which is what makes "is the relation explicitly represented?" testable.

- id: lake2018generalization
  title: "Generalization Without Systematicity: On the Compositional Skills of Sequence-to-Sequence Recurrent Networks"
  authors: Brenden Lake and Marco Baroni
  venue: ICML
  year: 2018
  subsection: relational-invariance
  tags: [must-read, negative-result]
  links:
    paper:
  in_survey: true
  tldr: >
    The systematicity challenge in its modern form — networks reliably capture
    low-level regularities and reliably fail when the same rule must be reused
    in a novel composition.

