- id: minegishi2026emergent
  title: Emergent Analogical Reasoning in Transformers
  authors: Gouki Minegishi, Jingyuan Feng, Hiroki Furuta, Takeshi Kojima, Yusuke Iwasawa and Yutaka Matsuo
  venue: arXiv
  year: 2026
  date: 2026-02
  subsection: relational-representation
  tags: [must-read]
  links:
    paper: https://arxiv.org/abs/2602.01992
  in_survey: false
  tldr: >
    Formalises analogy as a functor between categories and shows, on synthetic
    tasks, that it emerges from two identifiable mechanisms — geometric
    alignment of relational structure in embedding space plus application of
    the functor — with the same signatures visible in pretrained LLMs. The most
    direct mechanistic answer to §4 published since the survey.

