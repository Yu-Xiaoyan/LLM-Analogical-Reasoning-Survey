- id: chan2018solvent
  title: "SOLVENT: A Mixed-Initiative System for Finding Analogies between Research Papers"
  authors: Joel Chan et al.
  venue: CSCW
  year: 2018
  subsection: generation-mining
  tags: [must-read]
  links:
    paper: https://doi.org/10.1145/3274300
  in_survey: false
  proposed_addition: true
  priority: P1
  gap_reason: >
    Directly implements what §7.2.2 proposes as an opportunity — indexing
    papers by purpose and mechanism to retrieve cross-domain analogues.
  tldr: >
    Annotating papers by background, purpose, mechanism and findings, then
    matching on that structure, surfaces analogies that pure information
    retrieval misses — and domain experts judge them useful.

