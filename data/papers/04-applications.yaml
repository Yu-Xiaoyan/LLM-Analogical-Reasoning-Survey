- id: anon2025review
  date: 2025-04
  tldr: Maps case-based reasoning onto LLM agent architectures — retrieve, reuse, revise, retain. The CBR cycle is analogical transfer with an engineering vocabulary, and it already answers several questions the survey leaves open in §5.1.
  title: "Review of Case-Based Reasoning for LLM Agents: Theoretical Foundations, Architectural Components, and Cognitive Integration"
  authors: Kostas Hatalis, Despina Christou and Vyshnavi Kondapalli
  venue: arXiv
  year: 2025
  subsection: generation-mining
  tags: [must-read]
  links:
    paper: https://arxiv.org/abs/2504.06943
  in_survey: false
  proposed_addition: true
  priority: P1
  gap_reason: >
    Case-based reasoning is analogical reasoning under another name, with its
    own conference (ICCBR) and thirty years of results. The survey never
    mentions it, which leaves §5.1's retrieval discussion detached from the
    field that formalised case retrieval and adaptation.

