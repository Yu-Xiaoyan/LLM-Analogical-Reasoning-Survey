- id: anon2023analogical
  tldr: Separates two accounts of common-law reasoning — creating analogies to prior cases versus inducing rules from them — and shows the distinction is testable, which is precisely the source/target mapping question of SMT in a legal setting.
  title: "Analogical Reasoning, Generalization, and Rule Learning for Common Law Reasoning"
  authors: Joseph Blass and Kenneth D. Forbus
  venue: ICAIL
  year: 2023
  subsection: science
  tags: [must-read]
  links:
    paper: https://dl.acm.org/doi/10.1145/3594536.3595121
  in_survey: false
  proposed_addition: true
  priority: P1
  gap_reason: >
    §7.2.1 proposes jurisprudence as a future vertical for analogical
    reasoning, but AI & Law has modelled case-based analogy for three decades.
    The opportunity should be framed against that work, not as untouched ground.

