- id: webb2025evidence
  title: Evidence from Counterfactual Tasks Supports Emergent Analogical Reasoning in Large Language Models
  authors: Taylor Webb, Keith J. Holyoak and Hongjing Lu
  venue: PNAS Nexus
  year: 2025
  subsection: symbolic
  tags: [must-read]
  links:
    paper: https://arxiv.org/abs/2404.13070
  in_survey: false
  proposed_addition: true
  priority: P1
  gap_reason: >
    §3.1 stages the emergence debate as claim-then-rebuttal and stops there.
    This is the authors' reply, and it moves the conclusion from "the ability
    is illusory" to "it is sensitive to the execution medium".
  tldr: >
    Answers the counterfactual critiques: models do generalise to arbitrarily
    permuted alphabets once allowed to write and run code, so the failures
    localise to mental execution rather than to the mapping itself.

- id: mitchell2023comparing
  title: Comparing Humans, GPT-4, and GPT-4V on Abstraction and Reasoning Tasks
  authors: Melanie Mitchell, Alessandro B. Palmarini and Arseny Moskvichev
  venue: arXiv
  year: 2023
  subsection: perceptual
  tags: [must-read, multimodal, negative-result]
  links:
    paper: https://arxiv.org/abs/2311.09247
  in_survey: false
  proposed_addition: true
  priority: P1
  gap_reason: >
    The survey cites ConceptARC but not the headline evaluation its own
    authors ran on it — including the finding that the multimodal model does
    worse than the text-only one.
  tldr: >
    Better prompting lifts GPT-4 well above earlier reported ARC scores yet
    still far below humans, and GPT-4V underperforms GPT-4 — evidence that
    vision hurts rather than helps on grid abstraction.

